<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>10 Reasons ❤️</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            font-family: monospace;

            background:
                linear-gradient(
                    180deg,
                    #ffb6d9,
                    #ffcce6,
                    #ffe6f2
                );

            display: flex;
            justify-content: center;
            align-items: center;

            color: #5c2148;
        }

        /* MAIN GAME */

        .game {
            width: min(90%, 600px);
            text-align: center;
        }

        h1 {
            font-size: clamp(25px, 6vw, 45px);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 16px;
            margin-bottom: 30px;
        }

        /* HEART */

        .heart-button {
            width: 120px;
            height: 120px;

            border: none;
            background: #ff4f91;

            cursor: pointer;

            transform: rotate(-45deg);

            margin: 30px auto;

            position: relative;

            box-shadow:
                0 10px 30px rgba(0,0,0,.2);

            transition: .3s;
        }

        .heart-button::before,
        .heart-button::after {

            content: "";

            width: 120px;
            height: 120px;

            background: #ff4f91;

            border-radius: 50%;

            position: absolute;
        }

        .heart-button::before {
            top: -60px;
            left: 0;
        }

        .heart-button::after {
            left: 60px;
            top: 0;
        }

        .heart-button:hover {
            transform:
                rotate(-45deg)
                scale(1.1);
        }

        .heart-text {

            position: absolute;

            z-index: 10;

            transform: rotate(45deg);

            color: white;

            width: 120px;

            left: 0;
            top: 45px;

            font-size: 14px;
        }

        /* REASON CARD */

        .reason-card {

            background: rgba(255,255,255,.9);

            padding: 25px;

            border-radius: 20px;

            min-height: 130px;

            display: flex;

            justify-content: center;
            align-items: center;

            box-shadow:
                0 10px 30px rgba(0,0,0,.15);

            opacity: 0;

            transform: translateY(20px);

            transition: .5s;
        }

        .reason-card.show {

            opacity: 1;

            transform: translateY(0);
        }

        #reason {

            font-size: 18px;

            line-height: 1.6;
        }

        #counter {

            margin-top: 15px;

            font-size: 14px;
        }

        /* NEXT BUTTON */

        .next {

            margin-top: 25px;

            padding: 12px 30px;

            border: none;

            border-radius: 30px;

            background: #ff4f91;

            color: white;

            font-size: 16px;

            cursor: pointer;

            display: none;
        }

        /* FLOATING HEARTS */

        .floating-heart {

            position: fixed;

            bottom: -30px;

            font-size: 20px;

            animation:
                floatUp 6s linear forwards;

            pointer-events: none;
        }

        @keyframes floatUp {

            0% {
                transform:
                    translateY(0)
                    rotate(0);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform:
                    translateY(-110vh)
                    rotate(360deg);
                opacity: 0;
            }
        }

    </style>
</head>

<body>

<div class="game">

    <h1>
        10 Reasons ❤️
    </h1>

    <p class="subtitle">
        Why I Love You, Yeshi
    </p>


    <div class="reason-card" id="card">

        <p id="reason">
            Click the heart ❤️
        </p>

    </div>


    <button
        class="heart-button"
        onclick="showReason()">

        <span class="heart-text">
            CLICK ME ❤️
        </span>

    </button>


    <p id="counter">
        0 / 10
    </p>


    <button
        class="next"
        id="nextButton"
        onclick="goNext()">

        Continue to my letter 💌

    </button>

</div>


<script>

const reasons = [

    "I love the way you make even ordinary days feel special. ❤️",

    "I love your smile because somehow it makes everything better. 😊",

    "I love how comfortable I feel when I'm with you. 🫶",

    "I love all the little things you do that you probably don't even notice. 🌸",

    "I love the way you care about the people you love. 💕",

    "I love all the memories we've created together. 📸",

    "I love laughing with you, even about the stupidest things. 😂",

    "I love that I can be completely myself around you. ❤️",

    "I love having you beside me through both good days and bad days. 🌙",

    "And most importantly... I love you simply because you're YOU. ❤️"

];


let current = 0;


function showReason() {

    if (current >= reasons.length) {
        return;
    }

    const card =
        document.getElementById("card");

    const text =
        document.getElementById("reason");

    const counter =
        document.getElementById("counter");


    card.classList.remove("show");


    setTimeout(() => {

        text.innerHTML =
            reasons[current];

        counter.innerHTML =
            `${current + 1} / 10`;

        card.classList.add("show");

    }, 200);


    createHeart();

    current++;


    if (current === reasons.length) {

        setTimeout(() => {

            document
                .getElementById("nextButton")
                .style.display = "inline-block";

        }, 600);

    }

}


function createHeart() {

    const heart =
        document.createElement("div");

    heart.className =
        "floating-heart";

    heart.innerHTML =
        ["❤️","💕","💗","💖","🌸"]
        [Math.floor(Math.random() * 5)];

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.animationDuration =
        (4 + Math.random() * 4) + "s";

    document.body.appendChild(heart);


    setTimeout(() => {

        heart.remove();

    }, 8000);

}


function goNext() {

    window.location.href =
        "letter.html";

}


setInterval(createHeart, 900);

</script>

</body>
</html>
