<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>A Letter For Yeshi ❤️</title>


<style>

/* =========================
   BASIC SETUP
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    font-family:monospace;

    background:
    linear-gradient(
        135deg,
        #ffb6d9,
        #ffcce5,
        #ffeaf4
    );

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:hidden;

    color:#632747;

}


/* =========================
   CONTAINER
========================= */

.container{

    width:90%;

    max-width:650px;

    text-align:center;

}


/* =========================
   TITLE
========================= */

h1{

    font-size:
    clamp(25px,6vw,42px);

    margin-bottom:10px;

}

.subtitle{

    margin-bottom:35px;

    font-size:16px;

}


/* =========================
   ENVELOPE
========================= */

.envelope-container{

    display:flex;

    justify-content:center;

    align-items:center;

    height:260px;

}


/* Envelope */

.envelope{

    width:280px;

    height:180px;

    position:relative;

    cursor:pointer;

    transition:.4s;

}


/* Envelope body */

.envelope-body{

    position:absolute;

    width:100%;

    height:100%;

    background:#ff6fa8;

    border-radius:10px;

    box-shadow:
    0 15px 30px
    rgba(0,0,0,.2);

}


/* Triangle flap */

.flap{

    position:absolute;

    width:0;

    height:0;

    border-left:
    140px solid transparent;

    border-right:
    140px solid transparent;

    border-top:
    100px solid #ff4f91;

    top:0;

    left:0;

    z-index:3;

    transform-origin:top;

    transition:1s;

}


/* Letter inside */

.letter-paper{

    position:absolute;

    width:230px;

    height:150px;

    background:white;

    left:25px;

    top:20px;

    border-radius:5px;

    padding:20px;

    z-index:2;

    transition:1s;

    box-shadow:
    0 5px 15px
    rgba(0,0,0,.15);

}


/* Envelope opening */

.envelope.open .flap{

    transform:
    rotateX(180deg);

}


.envelope.open .letter-paper{

    transform:
    translateY(-110px);

}


/* Heart seal */

.seal{

    position:absolute;

    z-index:5;

    left:50%;

    top:85px;

    transform:
    translateX(-50%);

    font-size:35px;

    transition:.5s;

}

.envelope.open .seal{

    opacity:0;

}


/* =========================
   INSTRUCTION
========================= */

.instruction{

    margin-top:10px;

    font-size:16px;

}


/* =========================
   LOVE LETTER
========================= */

.letter{

    display:none;

    background:white;

    padding:30px;

    border-radius:20px;

    box-shadow:
    0 15px 40px
    rgba(0,0,0,.2);

    text-align:left;

    max-height:65vh;

    overflow-y:auto;

}


.letter.show{

    display:block;

    animation:
    appear .8s ease;

}


@keyframes appear{

    from{

        opacity:0;

        transform:
        translateY(30px);

    }

    to{

        opacity:1;

        transform:
        translateY(0);

    }

}


.letter h2{

    text-align:center;

    margin-bottom:20px;

    color:#ff4f91;

}


#letterText{

    font-family:
    Georgia,
    serif;

    font-size:18px;

    line-height:1.8;

    white-space:pre-line;

}


/* =========================
   CONTINUE BUTTON
========================= */

.next-button{

    margin-top:25px;

    padding:14px 30px;

    border:none;

    border-radius:30px;

    background:#ff4f91;

    color:white;

    font-family:monospace;

    font-size:16px;

    cursor:pointer;

    display:none;

}


.next-button:hover{

    transform:scale(1.05);

}


/* =========================
   FLOATING HEARTS
========================= */

.heart{

    position:fixed;

    bottom:-30px;

    pointer-events:none;

    font-size:20px;

    animation:
    floatUp 6s linear forwards;

}


@keyframes floatUp{

    0%{

        transform:
        translateY(0)
        rotate(0);

        opacity:0;

    }

    20%{

        opacity:1;

    }

    100%{

        transform:
        translateY(-110vh)
        rotate(360deg);

        opacity:0;

    }

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .envelope{

        width:240px;

        height:155px;

    }

    .flap{

        border-left-width:120px;

        border-right-width:120px;

        border-top-width:85px;

    }

    .letter-paper{

        width:200px;

        height:130px;

        left:20px;

    }

}

</style>

</head>


<body>


<div class="container">


    <h1>
        💌 A Letter For You
    </h1>


    <p class="subtitle">
        Something I've been wanting to tell you, Yeshi ❤️
    </p>



    <!-- =====================
         ENVELOPE
    ====================== -->

    <div
    class="envelope-container"
    id="envelopeContainer">


        <div
        class="envelope"
        id="envelope"
        onclick="openLetter()">


            <div
            class="envelope-body">
            </div>


            <div
            class="letter-paper">

                ❤️

            </div>


            <div
            class="flap">
            </div>


            <div
            class="seal">

                ❤️

            </div>


        </div>

    </div>


    <p
    class="instruction"
    id="instruction">

        Tap the envelope to open my letter ❤️

    </p>



    <!-- =====================
         LETTER
    ====================== -->

    <div
    class="letter"
    id="letter">


        <h2>
            To My Yeshi ❤️
        </h2>


        <div
        id="letterText">
        </div>


    </div>



    <button
    class="next-button"
    id="nextButton"
    onclick="nextPage()">

        I have another surprise for you 🎁

    </button>


</div>



<script>


/* =========================
   YOUR LOVE LETTER
========================= */

const message = `My dearest Yeshi,

Today marks 10 beautiful months of us. ❤️

Ten months may sound like just a number, but for me, it represents so many memories, conversations, laughs, little moments, and feelings that I will always keep close to my heart.

Thank you for being there for me.

Thank you for every smile you've given me, every conversation we've shared, and every little moment that made these months special.

I don't know what the future will bring, but I know that I want to keep creating beautiful memories with you.

These 10 months are only one chapter of our story.

I hope we have many, many more chapters to write together.

Happy 10 Monthsary, my love. ❤️

I love you.`;



/* =========================
   OPEN ENVELOPE
========================= */

function openLetter(){

    const envelope =
    document.getElementById(
        "envelope"
    );

    envelope.classList.add("open");


    document.getElementById(
        "instruction"
    ).style.display="none";


    setTimeout(() => {

        document.getElementById(
            "envelopeContainer"
        ).style.display="none";


        document.getElementById(
            "letter"
        ).classList.add("show");


        typeLetter();

    },1200);

}


/* =========================
   TYPEWRITER
========================= */

let index=0;


function typeLetter(){

    if(index < message.length){

        document.getElementById(
            "letterText"
        ).innerHTML +=
        message.charAt(index);

        index++;


        setTimeout(
            typeLetter,
            30
        );

    }
    else{

        document.getElementById(
            "nextButton"
        ).style.display="inline-block";

    }

}


/* =========================
   FLOATING HEARTS
========================= */

function createHeart(){

    const heart =
    document.createElement(
        "div"
    );


    heart.className="heart";


    const symbols=[
        "❤️",
        "💕",
        "💗",
        "💖",
        "🌸"
    ];


    heart.innerHTML =
    symbols[
        Math.floor(
            Math.random()
            * symbols.length
        )
    ];


    heart.style.left =
    Math.random()*100+"vw";


    heart.style.animationDuration =
    (4+Math.random()*4)+"s";


    document.body.appendChild(
        heart
    );


    setTimeout(
        () => heart.remove(),
        8000
    );

}


setInterval(
    createHeart,
    700
);


/* =========================
   NEXT PAGE
========================= */

function nextPage(){

    window.location.href =
    "gifts.html";

}

</script>


</body>

</html>
