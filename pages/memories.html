<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Our Memories ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    font-family:monospace;

    background:
    linear-gradient(
        135deg,
        #ffdde1,
        #ee9ca7
    );

    color:white;

    text-align:center;

    padding:30px 15px;

}


/* TITLE */

h1{

    font-size:
    clamp(25px,6vw,45px);

    margin-bottom:10px;

}

.subtitle{

    font-size:16px;

    margin-bottom:30px;

}


/* GALLERY */

.gallery{

    max-width:1100px;

    margin:auto;

    display:grid;

    grid-template-columns:
    repeat(
        auto-fit,
        minmax(220px,1fr)
    );

    gap:20px;

}


/* PHOTO CARD */

.photo-card{

    background:white;

    padding:10px;

    border-radius:15px;

    box-shadow:
    0 10px 25px
    rgba(0,0,0,.25);

    transform:rotate(
        var(--rotation)
    );

    transition:.4s;

}

.photo-card:hover{

    transform:
    rotate(0deg)
    scale(1.05);

    z-index:5;

}


/* IMAGE */

.photo-card img{

    width:100%;

    height:260px;

    object-fit:cover;

    border-radius:10px;

}


/* PHOTO NUMBER */

.photo-number{

    color:#ff4f81;

    padding:8px;

    font-size:14px;

}


/* NEXT BUTTON */

button{

    margin-top:40px;

    padding:15px 35px;

    border:none;

    border-radius:30px;

    background:#ff4f81;

    color:white;

    font-size:18px;

    cursor:pointer;

    transition:.3s;

}

button:hover{

    transform:scale(1.08);

}


/* FLOATING HEARTS */

.heart{

    position:fixed;

    bottom:-30px;

    font-size:20px;

    pointer-events:none;

    animation:
    floatUp 6s linear forwards;

}


@keyframes floatUp{

    0%{

        transform:
        translateY(0)
        rotate(0);

        opacity:0;

    }

    20%{

        opacity:1;

    }

    100%{

        transform:
        translateY(-110vh)
        rotate(360deg);

        opacity:0;

    }

}


/* MOBILE */

@media(max-width:600px){

    body{

        padding:20px 10px;

    }

    .gallery{

        grid-template-columns:
        repeat(2,1fr);

        gap:12px;

    }

    .photo-card img{

        height:190px;

    }

}

</style>

</head>


<body>


<h1>
📸 Our Memories ❤️
</h1>

<p class="subtitle">
22 moments, countless memories.
</p>


<div
class="gallery"
id="gallery">
</div>


<button
onclick="goNext()">

Continue ❤️

</button>


<script>


/* =================================
   YOUR 22 PHOTOS
================================= */

const totalPhotos = 22;

const gallery =
document.getElementById("gallery");


/* CREATE PHOTO CARDS */

for(
    let i = 1;
    i <= totalPhotos;
    i++
){

    const card =
    document.createElement("div");

    card.className =
    "photo-card";


    /* RANDOM POLAROID ROTATION */

    const rotation =
    (Math.random() * 6 - 3);

    card.style.setProperty(
        "--rotation",
        rotation + "deg"
    );


    card.innerHTML = `

        <img
        src="../images/photo${i}.jpg"
        alt="Our memory ${i}"
        loading="lazy"
        >

        <div class="photo-number">
            Memory ${i} ❤️
        </div>

    `;


    gallery.appendChild(card);

}


/* =================================
   FLOATING HEARTS
================================= */

function createHeart(){

    const heart =
    document.createElement("div");

    heart.className="heart";

    const hearts = [
        "❤️",
        "💕",
        "💗",
        "💖",
        "🌸"
    ];

    heart.innerHTML =
    hearts[
        Math.floor(
            Math.random()
            * hearts.length
        )
    ];


    heart.style.left =
    Math.random()*100+"vw";


    heart.style.animationDuration =
    (4+Math.random()*4)+"s";


    document.body.appendChild(
        heart
    );


    setTimeout(
        () => heart.remove(),
        8000
    );

}


setInterval(
    createHeart,
    800
);


/* =================================
   NEXT PAGE
================================= */

function goNext(){

    window.location.href =
    "reasons.html";

}

</script>


</body>

</html>
