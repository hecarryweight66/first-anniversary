<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Secret Puzzle 🔐</title>

<style>

/* RESET */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* BACKGROUND */

body{

    min-height:100vh;

    background:
    radial-gradient(circle at top,#302060,#110d25 65%);

    font-family:monospace;

    color:white;

    text-align:center;

    overflow:hidden;

}


/* GAME CONTAINER */

.game{

    min-height:100vh;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    padding:20px;

}


/* TITLE */

h1{

    font-size:clamp(28px,7vw,48px);

    margin-bottom:15px;

    color:#ff9fc4;

    text-shadow:
    3px 3px #6b315d;

}


/* SUBTITLE */

.subtitle{

    font-size:17px;

    max-width:600px;

    line-height:1.6;

    margin-bottom:30px;

}


/* PUZZLE BOX */

.puzzle{

    width:100%;

    max-width:500px;

    background:#21183c;

    border:3px solid #ff78a5;

    border-radius:25px;

    padding:30px 20px;

    box-shadow:
    0 0 30px rgba(255,120,165,.3);

}


/* LOCK */

.lock{

    font-size:65px;

    margin-bottom:15px;

    animation:float 2s ease-in-out infinite;

}


@keyframes float{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }

}


/* QUESTION */

.question{

    font-size:20px;

    line-height:1.7;

    margin-bottom:25px;

    color:#ffe6f0;

}


/* INPUT */

input{

    width:100%;

    max-width:350px;

    padding:15px;

    border-radius:12px;

    border:2px solid #ff78a5;

    background:#120d25;

    color:white;

    font-family:monospace;

    font-size:18px;

    text-align:center;

    outline:none;

}


input:focus{

    box-shadow:
    0 0 15px rgba(255,120,165,.6);

}


/* BUTTON */

button{

    margin-top:18px;

    padding:14px 35px;

    border:none;

    border-radius:25px;

    background:#ff5f91;

    color:white;

    font-family:monospace;

    font-size:17px;

    cursor:pointer;

    transition:.3s;

}


button:hover{

    transform:scale(1.08);

    box-shadow:
    0 5px 20px rgba(255,95,145,.4);

}


/* MESSAGE */

#message{

    min-height:30px;

    margin-top:20px;

    font-size:17px;

    line-height:1.6;

}


/* HINT */

.hint{

    margin-top:20px;

    font-size:13px;

    color:#c9b9d8;

}


/* SUCCESS */

.success{

    animation:success .8s ease;

}


@keyframes success{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.05);
    }

    100%{
        transform:scale(1);
    }

}


/* HEARTS */

.heart{

    position:fixed;

    bottom:-30px;

    pointer-events:none;

    animation:rise linear forwards;

}


@keyframes rise{

    0%{

        transform:
        translateY(0)
        rotate(0);

        opacity:0;

    }

    20%{
        opacity:1;
    }

    100%{

        transform:
        translateY(-110vh)
        rotate(360deg);

        opacity:0;

    }

}


/* SHAKE */

.shake{

    animation:shake .4s;

}


@keyframes shake{

    0%,100%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-10px);
    }

    75%{
        transform:translateX(10px);
    }

}


/* MOBILE */

@media(max-width:600px){

    .puzzle{

        padding:25px 15px;

    }

    .question{

        font-size:17px;

    }

    input{

        font-size:16px;

    }

}

</style>

</head>


<body>


<div class="game">


    <h1>🔐 SECRET GIFT</h1>


    <p class="subtitle">

        You found the secret gift...

        But there's one little lock

        standing between you and your surprise. ❤️

    </p>


    <div class="puzzle" id="puzzle">


        <div class="lock" id="lock">

            🔒

        </div>


        <div class="question">

            <p>
                🧩 <b>THE SECRET QUESTION</b>
            </p>

            <br>

            <p>
                How many months have<br>
                we been together? ❤️
            </p>

        </div>


        <input
            type="text"
            id="answer"
            placeholder="Enter the answer..."
            autocomplete="off"
        >


        <br>


        <button onclick="checkAnswer()">

            🔓 UNLOCK

        </button>


        <div id="message"></div>


        <p class="hint">

            💡 Hint: Look at the very beginning of our story...

        </p>


    </div>

</div>


<script>


function checkAnswer(){

    const input =
    document.getElementById("answer");

    const answer =
    input.value.trim().toLowerCase();


    const puzzle =
    document.getElementById("puzzle");

    const lock =
    document.getElementById("lock");

    const message =
    document.getElementById("message");


    /* CORRECT ANSWERS */

    if(
        answer === "10" ||
        answer === "ten" ||
        answer === "10 months" ||
        answer === "ten months"
    ){

        lock.innerHTML="🔓";

        message.innerHTML=
        "✨ CORRECT! ✨<br><br>" +
        "You unlocked the secret! ❤️";

        message.style.color="#ff9fc4";

        puzzle.classList.add("success");


        setTimeout(function(){

            message.innerHTML=
            "💖 Preparing your surprise... 💖";

        },1500);


        setTimeout(function(){

            window.location.href="qr.html";

        },3000);

    }


    /* WRONG ANSWER */

    else{

        lock.innerHTML="🔒";

        message.innerHTML=
        "❌ Not quite... Try again, love. ❤️";

        message.style.color="#ff9f9f";

        puzzle.classList.remove("shake");

        void puzzle.offsetWidth;

        puzzle.classList.add("shake");

        input.value="";

        input.focus();

    }

}


/* ENTER KEY */

document
.getElementById("answer")
.addEventListener("keydown",function(event){

    if(event.key==="Enter"){

        checkAnswer();

    }

});


/* FLOATING HEARTS */

function createHeart(){

    const heart =
    document.createElement("div");

    heart.className="heart";


    const symbols=[

        "❤️",
        "💕",
        "💗",
        "💖",
        "✨",
        "🌸"

    ];


    heart.innerHTML=
    symbols[
        Math.floor(
            Math.random()*symbols.length
        )
    ];


    heart.style.left=
    Math.random()*100+"vw";


    heart.style.fontSize=
    (14+Math.random()*20)+"px";


    heart.style.animationDuration=
    (4+Math.random()*4)+"s";


    document.body.appendChild(heart);


    setTimeout(function(){

        heart.remove();

    },8000);

}


setInterval(createHeart,600);


</script>


</body>

</html>
